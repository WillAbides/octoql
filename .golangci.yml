version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - forbidigo
    - gocritic
    - govet
    - ineffassign
    - modernize
    - nakedret
    - noinlineerr
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usetesting
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    errorlint:
      errorf: true
    forbidigo:
      forbid:
        - pattern: ^print(|f|ln)$
        - pattern: ^fmt\.Print(|f|ln)$
    gocritic:
      disabled-checks:
        - commentedOutCode
        - paramTypeCombine
        - sprintfQuotedString
        - unnamedResult
        - ifElseChain
        - sloppyReassign
        - typeDefFirst
      enabled-tags:
        - diagnostic
        - performance
        - style
      settings:
        captLocal:
          paramsOnly: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true
    revive:
      enable-all-rules: false
      rules:
        - name: argument-limit
          arguments:
            - 4
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: ^example/|^cmd/octoqlgen/
      - linters:
          - errcheck
        path: _test\.go$
        text: ^Error return value is not checked$
      - linters:
          - unparam
        path: _test\.go$
      - linters:
          - staticcheck
        path: ^internal/generate/parse\.go$
        text: 'SA1019: github\.com/vektah/gqlparser/v2/validator\.Validate is deprecated'
      - linters:
          - staticcheck
        path: ^internal/integration/integration_test\.go$
        text: 'QF1008: could remove embedded field'
      - linters:
          - usetesting
        path: ^internal/generate/generate_test\.go$
        text: 'os\.MkdirTemp\(\) could be replaced by t\.TempDir\(\)'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
