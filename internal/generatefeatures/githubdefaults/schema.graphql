schema {
  query: Query
}

scalar Base64String
scalar BigInt
scalar CustomPropertyValue
scalar Date
scalar DateTime
scalar GitObjectID
scalar GitRefname
scalar GitSSHRemote
scalar GitTimestamp
scalar HTML
scalar PreciseDateTime
scalar URI
scalar X509Certificate

interface Node {
  id: ID!
  url: URI!
}

interface Actor {
  login: String!
  url: URI!
}

type Repository implements Node {
  id: ID!
  url: URI!
  nameWithOwner: String!
}

type Issue implements Node {
  id: ID!
  url: URI!
  title: String!
}

type Bot implements Node & Actor {
  id: ID!
  login: String!
  url: URI!
}

type Organization implements Node & Actor {
  id: ID!
  login: String!
  url: URI!
}

type Review {
  fullDatabaseId: BigInt!
  createdAt: DateTime!
  publishedOn: Date!
  updatedAt: PreciseDateTime!
  pushedAt: GitTimestamp!
  oid: GitObjectID!
  refname: GitRefname!
  sshRemote: GitSSHRemote!
  bodyHTML: HTML!
  encoded: Base64String!
  certificate: X509Certificate!
  propertyValue: CustomPropertyValue
  author: Actor
  editor: Actor
}

type Query {
  review: Review!
  node(id: ID!): Node
  nestedNodes: [[[Node]]]
  echoCollision(
    ctx: String!
    client: String!
    err: String!
    vars: String!
    response: String!
    hasData: String!
  ): String!
}
