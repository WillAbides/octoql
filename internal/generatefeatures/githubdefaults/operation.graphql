query getReview {
  review {
    fullDatabaseId
    createdAt
    publishedOn
    updatedAt
    pushedAt
    oid
    refname
    sshRemote
    bodyHTML
    encoded
    certificate
    propertyValue
    author @octoqlgen(struct: true) {
      login
      url
    }
    editor @octoqlgen(struct: true) {
      login
      url
    }
  }
}

query variableCollisions(
  $ctx: String!
  $client: String!
  $err: String!
  $vars: String!
  $response: String!
  $hasData: String!
) {
  echoCollision(
    ctx: $ctx
    client: $client
    err: $err
    vars: $vars
    response: $response
    hasData: $hasData
  )
}

query runtimeAbstracts($id: ID!) {
  node(id: $id) {
    id
    url
    ... on Repository {
      nameWithOwner
    }
  }
  nestedNodes {
    id
    url
  }
  actorNode: node(id: $id) {
    ... on Actor {
      login
    }
  }
}
