query getRepository($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
  }
}

query wireSemantics {
  date
  dates
  node {
    __typename
    id
    ... on User {
      login
    }
  }
  nodes {
    __typename
    id
    ... on User {
      login
    }
  }
}
